<!DOCTYPE html>
<html>
<head>
    <title>Nexus Stresser | Free DDoS Tool</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #0a0a0a;
            color: #0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #121212;
            padding: 20px;
            border: 1px solid #0f0;
            border-radius: 5px;
        }        h1 {
            text-align: center;
            color: #0f0;
        }        input, select, button {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #1e1e1e;
            color: #0f0;
            border: 1px solid #0f0;
        }
        button {
            background: #0d3d0d;
            cursor: pointer;
        }
        button:hover {
            background: #1a5e1a;
        }
        .logs {
            background: #000;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            margin-top: 10px;
        } </style>
</head>
<body>
    <div class="container"> <h1>Nexus Stresser</h1>
        <input type="text" id="target" placeholder="Target IP/Domain"> <input type="number" id="port" placeholder="Port (Optional)">
        <select id="method">
            <option value="udp">UDP Flood</option>
            <option value="tcp">TCP SYN Flood</option>
            <option value="http">HTTP Flood</option>
        </select>
        <button id="launch">LAUNCH ATTACK</button>
        <div class="logs" id="logs"></div> </div>

    <script>
        const launchBtn = document.getElementById('launch');
        const logs = document.getElementById('logs');

        function log(message) {            logs.innerHTML += `[${new Date().toLocaleTimeString()}] ${message}\n`;            logs.scrollTop = logs.scrollHeight;
        }        launchBtn.addEventListener('click', () => {            const target = document.getElementById('target').value;
            const port = document.getElementById('port').value; const method = document.getElementById('method').value; if (!target) {
                log("Error: No target specified.");
                return;            }

            log(`Attacking ${target} with ${method.toUpperCase()}...`);

            fetch('/attack', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target, port, method })
            })            .then(res => res.json())
            .then(data => log(data.success ? "Attack launched." : `Error: ${data.message}`))            .catch(err => log(`Error: ${err}`));
        });    </script>
</body>
</html>
